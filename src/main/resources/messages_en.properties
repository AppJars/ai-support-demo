# Login (one-click account picker)
appjars.aisupport.demo.login.title=Choose an account
appjars.aisupport.demo.login.intro=Pick an account to sign in — no password needed. Olivia and Marcus are the Lumen Robotics support team; Sophia and Leo are customers.
appjars.aisupport.demo.login.button=Sign in as {0}
appjars.aisupport.demo.login.error=Login failed. Please try again.
appjars.aisupport.demo.login.role.admin=Administrator
appjars.aisupport.demo.login.role.user=User
appjars.aisupport.demo.login.persona.olivia.desc=Support Lead — sees every customer conversation and can post internal, admin-only notes.
appjars.aisupport.demo.login.persona.marcus.desc=AI Manager — configures assistants, language models, prompts and the knowledge base.
appjars.aisupport.demo.login.persona.sophia.desc=Customer — chats with support and the AI assistant; sees only her own conversation.
appjars.aisupport.demo.login.persona.leo.desc=Customer — a second identity, handy for trying a multi-user conversation.

# Home (landing page)
appjars.aisupport.demo.home.title=Home
appjars.aisupport.demo.home.hero.title=AI Support
appjars.aisupport.demo.home.hero.tagline=Add a full-featured, AI-powered support chat to your Vaadin application — assistants, language models and document-grounded answers (RAG), all managed from the app itself.
appjars.aisupport.demo.home.features.title=What''s inside
appjars.aisupport.demo.home.features.chat.title=Conversational chat
appjars.aisupport.demo.home.features.chat.desc=Real-time chat with an AI assistant, a persistent chat bubble on every page and multi-user conversations.
appjars.aisupport.demo.home.features.assistants.title=AI assistants
appjars.aisupport.demo.home.features.assistants.desc=Create assistants that combine a language model, a system prompt and, optionally, a knowledge base to answer in their own way.
appjars.aisupport.demo.home.features.rag.title=Documents & RAG
appjars.aisupport.demo.home.features.rag.desc=Upload documents that are embedded into a vector store, so assistants answer from your own content instead of guessing (Retrieval-Augmented Generation).
appjars.aisupport.demo.home.features.llms.title=Language models
appjars.aisupport.demo.home.features.llms.desc=Connect the model providers you prefer: a local Ollama model out of the box, or OpenAI with your own API key.
appjars.aisupport.demo.home.features.prompts.title=Prompts
appjars.aisupport.demo.home.features.prompts.desc=Manage the system prompts that shape how each assistant behaves, right from the running application.
appjars.aisupport.demo.home.features.inspector.title=LLM inspector
appjars.aisupport.demo.home.features.inspector.desc=Inspect every exchange with the model — prompt, retrieved chunks and token usage — to understand and debug answers.
appjars.aisupport.demo.home.features.channels.title=Omnichannel
appjars.aisupport.demo.home.features.channels.desc=Bring conversations in from WhatsApp, Facebook and Instagram through built-in webhook integrations.
appjars.aisupport.demo.home.tryit.title=Try it now
appjars.aisupport.demo.home.tryit.intro=Sign in with one click — pick any of the four demo accounts, no password needed. Olivia and Marcus are the Lumen Robotics support team; Sophia and Leo are customers.
appjars.aisupport.demo.home.tryit.chat=Start chatting
appjars.aisupport.demo.home.tryit.admin=Available assistants
appjars.aisupport.demo.home.license.title=Free vs. full license
appjars.aisupport.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 50 messages in total. A full license removes the limit — nothing else changes.
appjars.aisupport.demo.home.license.link=Get a license
appjars.aisupport.demo.home.links.title=Learn more
appjars.aisupport.demo.home.links.github=AppJars on GitHub
appjars.aisupport.demo.home.links.readme=AI Support documentation
appjars.aisupport.demo.home.links.appjars=Visit the AppJars website

# Guided tours (step content)
appjars.aisupport.demo.tour.btn.next=Next
appjars.aisupport.demo.tour.btn.back=Back
appjars.aisupport.demo.tour.btn.done=Done
appjars.aisupport.demo.tour.home.welcome.title=Welcome to the AI Support demo
appjars.aisupport.demo.tour.home.welcome.desc=This landing page introduces what the AI Support appjar adds to your application. Let''s take a quick look around.
appjars.aisupport.demo.tour.home.features.title=What''s inside
appjars.aisupport.demo.tour.home.features.desc=A summary of the main features. Each one has its own guided tour in the menu you just used.
appjars.aisupport.demo.tour.home.tryit.title=Signing in
appjars.aisupport.demo.tour.home.tryit.desc=Sign in with one click using any of the demo accounts — no password needed. Two are administrators, two are customers.
appjars.aisupport.demo.tour.home.license.title=Free mode
appjars.aisupport.demo.tour.home.license.desc=The demo runs in free mode: every feature works, capped at 50 messages in total. That''s it — pick a tour or start chatting!
appjars.aisupport.demo.tour.chat.intro.title=The AI chat
appjars.aisupport.demo.tour.chat.intro.desc=This is the full-page chat. You can also open it from the floating bubble available on every page.
appjars.aisupport.demo.tour.chat.sessions.title=Your conversations
appjars.aisupport.demo.tour.chat.sessions.desc=Every conversation you take part in is listed here — pick one to carry on where you left off.
appjars.aisupport.demo.tour.chat.newsession.title=Start a new chat
appjars.aisupport.demo.tour.chat.newsession.desc=The <b>+</b> button opens a fresh conversation, with its own history and its own assistant.
appjars.aisupport.demo.tour.chat.search.title=Search
appjars.aisupport.demo.tour.chat.search.desc=Search across your sessions <i>and</i> their messages by text — the quickest way to find a past conversation by something that was said in it.
appjars.aisupport.demo.tour.chat.filter.title=Filter
appjars.aisupport.demo.tour.chat.filter.desc=Filter the session list by attributes — status, assistant, date — a structured way to narrow the list down, as opposed to free-text search.
appjars.aisupport.demo.tour.chat.input.title=Write a message
appjars.aisupport.demo.tour.chat.input.desc=Type your question here. The conversation is kept, so the assistant remembers the context.
appjars.aisupport.demo.tour.chat.send.title=Send
appjars.aisupport.demo.tour.chat.send.desc=Send your message; the assistant''s reply streams back in real time.
appjars.aisupport.demo.tour.chat.assistants.title=Choose an assistant
appjars.aisupport.demo.tour.chat.assistants.desc=Use the assistant selector at the top of the chat to switch between the <b>General Assistant</b> (chats about anything) and the <b>Support Assistant</b> assistants (which answer only from their own Zephyr One knowledge base).
appjars.aisupport.demo.tour.chat.rag.title=See RAG in action
appjars.aisupport.demo.tour.chat.rag.desc=Switch to the Support Assistant and ask <i>"What does error E-27 mean?"</i> — it answers from the document. Ask something that isn''t in the guide and it will tell you it doesn''t know.
appjars.aisupport.demo.tour.bubble.intro.title=Chat from any page
appjars.aisupport.demo.tour.bubble.intro.desc=You don''t have to be on the chat screen to talk to an assistant. A floating button in the corner of every page (except the full chat) opens this assistant. We''ve opened it for you — take a look.
appjars.aisupport.demo.tour.bubble.sessions.title=Switch conversations
appjars.aisupport.demo.tour.bubble.sessions.desc=The bubble has its own session picker, so you can jump between conversations without leaving the page you are on.
appjars.aisupport.demo.tour.bubble.input.title=Type your message
appjars.aisupport.demo.tour.bubble.input.desc=Ask your question right here — it''s the same input you get on the full chat page. Press <b>Enter</b> or use the send button to submit, and the reply streams back inside the bubble.
appjars.aisupport.demo.tour.bubble.send.title=Send
appjars.aisupport.demo.tour.bubble.send.desc=Sends your message to the selected assistant without leaving the page you''re on. Use the round button in the corner to open or close the bubble anywhere in the app.
appjars.aisupport.demo.tour.bubble.move.title=Move and resize
appjars.aisupport.demo.tour.bubble.move.desc=The chat bubble can be dragged anywhere on the screen, and the chat window can be resized to your preferred size by dragging its corners.
appjars.aisupport.demo.tour.assistants.intro.title=Assistants
appjars.aisupport.demo.tour.assistants.intro.desc=Assistants are the heart of AI Support. This screen lists them and lets you create and configure new ones.
appjars.aisupport.demo.tour.assistants.grid.title=Your assistants
appjars.aisupport.demo.tour.assistants.grid.desc=Every assistant is listed here. The demo ships three: a General Assistant, and two document-grounded support assistants — one customer-facing, one internal.
appjars.aisupport.demo.tour.assistants.create.title=Create an assistant
appjars.aisupport.demo.tour.assistants.create.desc=Use <b>Add assistant</b> to add one — give it a language model, a system prompt and, optionally, one or more knowledge-base categories.
appjars.aisupport.demo.tour.assistants.default.title=The default assistant
appjars.aisupport.demo.tour.assistants.default.desc=One assistant is the default: it is the one new chats start with. Everything here is editable.
appjars.aisupport.demo.tour.prompts.intro.title=Prompts
appjars.aisupport.demo.tour.prompts.intro.desc=A prompt is the system instruction that tells an assistant how to behave. This screen manages the reusable prompts.
appjars.aisupport.demo.tour.prompts.grid.title=Your prompts
appjars.aisupport.demo.tour.prompts.grid.desc=Each row is a prompt. The demo ships three, one per assistant, each with its own revision history.
appjars.aisupport.demo.tour.prompts.create.title=Create a prompt
appjars.aisupport.demo.tour.prompts.create.desc=Click <b>Create prompt</b> to write one, then assign it to an assistant on the Assistants screen.
appjars.aisupport.demo.tour.prompts.finish.title=Writing a good prompt
appjars.aisupport.demo.tour.prompts.finish.desc=A good prompt defines the assistant''s role, tone and limits — for example, telling it to answer only from the provided documents.
appjars.aisupport.demo.tour.llms.intro.title=Language models
appjars.aisupport.demo.tour.llms.intro.desc=Here you connect the AI providers your assistants use. Let''s take a look.
appjars.aisupport.demo.tour.llms.grid.title=Language models
appjars.aisupport.demo.tour.llms.grid.desc=The models your assistants can use. The demo ships a local Ollama model (llama3.2:3b) that runs without any API key, plus a disabled OpenAI entry ready for your own key.
appjars.aisupport.demo.tour.llms.create.title=Add a provider
appjars.aisupport.demo.tour.llms.create.desc=Add another model — for example OpenAI with your own API key — for faster, higher-quality answers, then assign it to an assistant.
appjars.aisupport.demo.tour.llms.finish.title=Good to know
appjars.aisupport.demo.tour.llms.finish.desc=Models are shared across assistants, so you configure a provider once and reuse it everywhere.
appjars.aisupport.demo.tour.documents.intro.title=Documents & knowledge base
appjars.aisupport.demo.tour.documents.intro.desc=Documents give assistants knowledge to ground their answers on. Here''s how they''re managed.
appjars.aisupport.demo.tour.documents.grid.title=Knowledge base
appjars.aisupport.demo.tour.documents.grid.desc=Documents make up the knowledge base. The two Zephyr One documents are already embedded here.
appjars.aisupport.demo.tour.documents.upload.title=Upload a document
appjars.aisupport.demo.tour.documents.upload.desc=Upload a file and it is split into chunks and embedded into a vector store, ready for retrieval (RAG).
appjars.aisupport.demo.tour.documents.categories.title=Group and connect
appjars.aisupport.demo.tour.documents.categories.desc=Organize documents into categories, then attach a category to an assistant so its answers are grounded in that content.
appjars.aisupport.demo.tour.categories.intro.title=Categories
appjars.aisupport.demo.tour.categories.intro.desc=Categories group your knowledge-base documents, so an assistant can be pointed at a whole topic at once.
appjars.aisupport.demo.tour.categories.grid.title=Your categories
appjars.aisupport.demo.tour.categories.grid.desc=Each row is a category. The demo ships two: the customer-facing Product Knowledge Base and the Internal Support Playbook.
appjars.aisupport.demo.tour.categories.create.title=Create a category
appjars.aisupport.demo.tour.categories.create.desc=Click <b>Add category</b> to add one, then attach documents to it from the Documents screen.
appjars.aisupport.demo.tour.categories.finish.title=Connecting knowledge
appjars.aisupport.demo.tour.categories.finish.desc=Attach a category to an assistant on the Assistants screen to ground its answers in those documents.
appjars.aisupport.demo.tour.inspector.intro.title=The LLM inspector
appjars.aisupport.demo.tour.inspector.intro.desc=The inspector shows exactly what happened in each exchange with the model — invaluable for understanding and debugging answers.
appjars.aisupport.demo.tour.inspector.grid.title=Pick a conversation
appjars.aisupport.demo.tour.inspector.grid.desc=Select a conversation here to load its exchanges. The demo ships a pre-seeded support conversation, so there is already something to inspect.
appjars.aisupport.demo.tour.inspector.tree.title=The exchange breakdown
appjars.aisupport.demo.tour.inspector.tree.desc=Each message expands into what actually happened: the full prompt sent to the model, its reply, the document chunks retrieved for RAG and the token counts.
appjars.aisupport.demo.tour.inspector.details.title=Dig into a message
appjars.aisupport.demo.tour.inspector.details.desc=Use the options menu on any row to open the exact request and response sent to the model, or the full RAG retrieval that grounded the answer.
appjars.aisupport.demo.tour.channels.intro.title=Channels
appjars.aisupport.demo.tour.channels.intro.desc=A channel connects AI Support to an external chat provider — WhatsApp, Facebook Messenger or Instagram. Messages from those platforms arrive here as chat sessions that an assistant can answer automatically.
appjars.aisupport.demo.tour.channels.grid.title=Your channels
appjars.aisupport.demo.tour.channels.grid.desc=Each row is a channel, pairing a messaging platform with the assistant that handles its conversations.
appjars.aisupport.demo.tour.channels.create.title=Create a channel
appjars.aisupport.demo.tour.channels.create.desc=Click <b>Channel</b> to add one: choose the platform, connect it to an assistant, and enter the credentials from your Meta app.
appjars.aisupport.demo.tour.channels.docs.title=Connecting to Meta
appjars.aisupport.demo.tour.channels.docs.desc=Connecting a real channel requires setting up a Meta app — webhooks, a verify token and access tokens. Follow the full step-by-step guide in the <a href="https://docs.appjars.com/ai-support/administrator-features/configure-meta-channels/" target="_blank">documentation</a>.
