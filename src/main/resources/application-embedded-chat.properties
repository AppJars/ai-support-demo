# ============================================================
# Embedded chat profile (--spring.profiles.active=embedded-chat)
# ============================================================
# Serves <ai-support-chat> to a site running on the same machine, such as Yavu on
# http://localhost:8080. Administer the demo from http://127.0.0.1:8081: the chat host
# (localhost) answers 404 to everything except the web component.

# Leaves port 8080 to the embedding site
server.port=8081

# Enables the <ai-support-chat> web component
appjars.aisupport.integrations.embedded-chat.enabled=true

# Hosts dedicated to the chat
appjars.aisupport.integrations.embedded-chat.hosts=localhost

# Secret that signs the visitor cookie (32 characters or more)
appjars.aisupport.integrations.embedded-chat.visitor-key=${AI_SUPPORT_VISITOR_KEY}

# Lets the visitor cookie work over plain HTTP
appjars.aisupport.integrations.embedded-chat.secure-cookie=false

# Cookies do not separate ports, so the demo session must not share the JSESSIONID of the site
server.servlet.session.cookie.name=AISUPPORT_SESSION
