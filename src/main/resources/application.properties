# ============================================================
# Spring / Database
# ============================================================

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=100MB

# Maximum total size of an upload request
spring.servlet.multipart.max-request-size=100MB

# Hibernate DDL auto strategy (create, create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Keep the JPA session open during view rendering (set explicitly to avoid the startup warning)
spring.jpa.open-in-view=true

# Username for the PostgreSQL datasource
spring.datasource.username=aisupport

# Password for the PostgreSQL datasource
spring.datasource.password=aisupport

# JDBC URL for the PostgreSQL datasource (resolved from appjars.database.* properties)
spring.datasource.url=jdbc:postgresql://${appjars.database.host}:${appjars.database.port}/${appjars.database.name}

# Import optional messages bundle for i18n
spring.config.import=optional:classpath:messages.properties

# ============================================================
# Vaadin
# ============================================================

# Server push mode (AUTOMATIC, MANUAL, DISABLED)
vaadin.pushMode=AUTOMATIC

# ============================================================
# Database Connection (AppJars)
# ============================================================

# PgVector database host
appjars.database.host=localhost

# PgVector database port
appjars.database.port=5432

# PgVector database name
appjars.database.name=aisupport

# ============================================================
# PgVector / Embedding Store
# ============================================================

# Embedding vector dimensions; must match the output size of the embedding model
spring.ai.vectorstore.pgvector.dimensions=384

# Table holding the embeddings
spring.ai.vectorstore.pgvector.table-name=as_embedding

# ============================================================
# External Embedding Model
# ============================================================

# Path to an external ONNX embedding model; uses the bundled E5-Small-v2 when unset
# Example: /path/to/model.onnx
appjars.aisupport.embedding.model=

# Tokenizer paired with the external embedding model
# Example: /path/to/tokenizer.json
appjars.aisupport.embedding.tokenizer=

# Pooling for the external embedding model (mean or cls)
appjars.aisupport.embedding.pooling-mode=mean

# ============================================================
# Retrieval (RAG)
# ============================================================

# Chunks retrieved per query from the vector store
appjars.aisupport.embedding-search.maxResults=10

# Minimum similarity score (0.0-1.0) a chunk must reach
appjars.aisupport.embedding-search.minScore=0.75

# Chunks kept per query after reranking (ignored when no scoring model is configured)
appjars.aisupport.embedding-search.maxResultsAfterScoring=6

# Chunks kept after fusing every query's results
appjars.aisupport.embedding-search.maxResultsAfterAggregation=20

# ============================================================
# RAG Scoring Model (Re-ranker)
# ============================================================

# Path to an ONNX reranking model; reranking is skipped when unset
# Example: reranker/model.onnx
appjars.aisupport.rag.scoring-model.path=

# Tokenizer paired with the reranking model
# Example: reranker/tokenizer.json
appjars.aisupport.rag.scoring-model.tokenizer=

# ============================================================
# Advanced RAG
# ============================================================

# Search-query guidance, relative to the classpath /prompts directory
appjars.aisupport.advanced-rag.prompt-file=defaults/advanced-rag.md

# Search queries the LLM generates per request
appjars.aisupport.advanced-rag.queryCount=5

# Maximum length of each generated query
appjars.aisupport.advanced-rag.queryMaxChars=300

# ============================================================
# Prompts and Moderation
# ============================================================

# Session-summary guidance, relative to the classpath /prompts directory
appjars.aisupport.summarize.prompt-file=defaults/summary.md

# Fully qualified class of a custom SessionSummaryProvider
# Example: com.example.MySessionSummaryProvider
appjars.aisupport.summarize.provider=

# Enable moderation of incoming messages
appjars.aisupport.profanity.check=true

# Moderation policy, relative to the classpath /prompts directory
appjars.aisupport.profanity.prompt-file=defaults/profanity.md

# Reply returned for a flagged message
appjars.aisupport.profanity.message=I can't help you with that. I'm sorry.

# ============================================================
# LLM Models and Tokenizers
# ============================================================

# Request timeout in seconds for every LLM call
com.appjars.aisupport.models.timeout=120

# OpenAI moderation model
com.appjars.aisupport.models.openai.moderation=omni-moderation-latest

# Context window (num_ctx) for Ollama models
appjars.aisupport.models.ollama.context-window=4096

# HuggingFace tokenizer for Llama 3 token counting (bundled with the demo)
appjars.aisupport.tokenizer.llama3=tokenizers/llama3-tokenizer.json

# HuggingFace tokenizer for Mistral/Mixtral token counting
# Example: /path/to/mistral/tokenizer.json
appjars.aisupport.tokenizer.mistral=

# HuggingFace tokenizer for Gemma token counting
# Example: /path/to/gemma/tokenizer.json
appjars.aisupport.tokenizer.gemma=

# ============================================================
# Chat Attachments
# ============================================================

# Directory where uploaded files are stored; attachments are disabled when unset
appjars.aisupport.chat.attachments.base-path=${java.io.tmpdir}/ai-support-demo/attachments

# Maximum files per message
appjars.aisupport.chat.attachments.max-files=3

# Maximum size per file, in MB
appjars.aisupport.chat.attachments.max-size=10

# Lifetime in seconds of a generated attachment download link
appjars.aisupport.attachments.resource-expires-after=300

# ============================================================
# Tooling
# ============================================================

# Comma-separated packages scanned for Spring beans with @Tool methods to expose to the LLM;
# no tools are exposed when unset
# Example: com.example.tools,com.myapp.ai
appjars.aisupport.tooling.allowedPackages=

# ============================================================
# Channels
# ============================================================

# Register the WhatsApp webhook endpoint
appjars.aisupport.integrations.whatsapp.enabled=false

# Register the Facebook webhook endpoint
appjars.aisupport.integrations.facebook.enabled=false

# Register the Instagram webhook endpoint
appjars.aisupport.integrations.instagram.enabled=false

# Public base URL used to build webhook endpoints and media links
# Example: https://demo.example.com
appjars.aisupport.public-url=

# Meta app secret used to authenticate webhook payloads; required for any Meta channel
appjars.aisupport.integrations.meta.app-secret=

# WhatsApp webhook verification token
appjars.aisupport.integrations.whatsapp.verify-token=

# Facebook webhook verification token
appjars.aisupport.integrations.facebook.verify-token=

# Instagram webhook verification token
appjars.aisupport.integrations.instagram.verify-token=

# Locale for system messages generated from a channel
appjars.aisupport.integrations.locale=en

# Resolve the sender's display name through the Meta API
appjars.aisupport.meta.resolve-usernames=true

# ============================================================
# Date and Time Formatting
# ============================================================

# Pattern for date and time values
appjars.aisupport.config.datetimepattern=dd/MM/yyyy, hh:mm a

# Pattern for date-only values
appjars.aisupport.config.datepattern=dd/MM/yyyy

# Pattern for time-only values
appjars.aisupport.config.timepattern=hh:mm a

# ============================================================
# Scheduled Maintenance: Inactive Session Closer
# ============================================================

# Cron expression controlling when the task runs (0 0/10 * * * * = every 10 minutes). The task is
# registered only when this property is present, and an empty value fails startup: comment the line
# out to disable the task.
appjars.aisupport.close-inactive-session.schedule=0 0/10 * * * *

# Time zone of the schedule (IANA time zone ID)
appjars.aisupport.close-inactive-session.zone=UTC

# Days without activity before a session is closed
appjars.aisupport.close-inactive-session.minLastActivityDayAge=15

# Sessions closed per run (-1 for unlimited)
appjars.aisupport.close-inactive-session.maxToProcessPerRun=10

# ============================================================
# Scheduled Maintenance: LLM Exchange Pruner
# ============================================================

# Cron expression controlling when the task runs; see the caveat above about empty values
appjars.aisupport.exchange-pruner.schedule=0 0/10 * * * *

# Time zone of the schedule (IANA time zone ID)
appjars.aisupport.exchange-pruner.zone=UTC

# Days before an exchange is eligible for deletion
appjars.aisupport.exchange-pruner.minDayAge=15

# Exchanges deleted per run (-1 for unlimited)
appjars.aisupport.exchange-pruner.maxToProcessPerRun=10

# ============================================================
# Scheduled Maintenance: System Message Pruner
# ============================================================

# Cron expression controlling when the task runs. The task is registered only when this property is
# present, and an empty value fails startup: comment the line out to disable the task.
appjars.aisupport.system-message-pruner.schedule=0 0/10 * * * *

# Time zone of the schedule (IANA time zone ID)
appjars.aisupport.system-message-pruner.zone=UTC

# Days before a system message is eligible for deletion; must be at least 1
appjars.aisupport.system-message-pruner.minDayAge=15

# System messages deleted per run (-1 for unlimited)
appjars.aisupport.system-message-pruner.maxToProcessPerRun=10

# ============================================================
# View Routes
# ============================================================

# AI chat view
com.appjars.aisupport.url.views.chat=as/chat

# Assistants view
com.appjars.aisupport.url.views.assistants=as/assistants

# Prompts view
com.appjars.aisupport.url.views.prompts=as/prompts

# LLMs view
com.appjars.aisupport.url.views.llms=as/llms

# Categories view
com.appjars.aisupport.url.views.categories=as/categories

# Documents view
com.appjars.aisupport.url.views.documentsview=as/documents

# LLM Inspector view
com.appjars.aisupport.url.views.inspector=as/inspector

# Channels view
com.appjars.aisupport.url.views.channels=as/channels

# Legacy route, redirects to the channels view
com.appjars.aisupport.url.views.whatsapp_phones=as/whatsapp_phones

# Legacy route, redirects to the channels view
com.appjars.aisupport.url.views.whatsapp_tokens=as/whatsapp_tokens
